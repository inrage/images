name: Update

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/**
      - .github/workflows/main.yml
      - images/**
      - stability-tags/**
      - tools/**
      - update.sh
      - tests/poller-workflow.rb
      - tests/poller-git.py
      - tests/poller-base-images.py
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          ruby tests/poller-workflow.rb
          python3 tests/poller-git.py
          python3 tests/poller-base-images.py
  images:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script: [php]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions
        with:
          dir: images
          script: ${{ matrix.script }}
          repository: docker-php
          app-client-id: ${{ vars.INRBOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.INRBOT_APP_PRIVATE_KEY }}
  stability-tags:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [docker-wordpress, docker-prestashop, frankenphp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions
        with:
          dir: stability-tags
          script: ${{ matrix.script }}
          repository: ${{ matrix.script }}
          app-client-id: ${{ vars.INRBOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.INRBOT_APP_PRIVATE_KEY }}
  tools:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script: [wp-cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions
        with:
          dir: tools
          script: ${{ matrix.script }}
          repository: docker-wordpress
          app-client-id: ${{ vars.INRBOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.INRBOT_APP_PRIVATE_KEY }}
