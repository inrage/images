name: Update WordPress consumers

on:
  schedule:
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths:
      - renovate-wordpress.json
      - renovate-wordpress.dry-run.cjs
      - .github/workflows/renovate-wordpress.yml
      - tests/renovate-workflow.rb
  pull_request:
    paths:
      - renovate-wordpress.json
      - renovate-wordpress.dry-run.cjs
      - .github/workflows/renovate-wordpress.yml
      - tests/renovate-workflow.rb
  workflow_dispatch:
    inputs:
      mode:
        description: Operation
        type: choice
        options:
          - simulate
          - update
        default: simulate
      repository_filter:
        description: Repository or pattern within inrage
        type: string
        default: inrage/*

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate Renovate configuration
        run: |
          ruby tests/renovate-workflow.rb
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/config,readonly" \
            --entrypoint renovate-config-validator \
            ghcr.io/renovatebot/renovate@sha256:9f571539ab94f0798d9439110ecf38c1e540920520794d87e111fbb97c322d50 \
            --strict /config/renovate-wordpress.json /config/renovate-wordpress.dry-run.cjs
  renovate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ github.event_name == 'schedule' && 'update' || inputs.mode }}
      REPOSITORY_FILTER: ${{ github.event_name == 'schedule' && 'inrage/*' || inputs.repository_filter }}
    concurrency:
      group: renovate-wordpress
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check execution scope
        run: |
          case "$MODE" in
            simulate|update) ;;
            *) echo "Unsupported operation" >&2; exit 1 ;;
          esac
          if [[ "$MODE" != simulate && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Write operations must run from main" >&2
            exit 1
          fi
          if [[ ! "$REPOSITORY_FILTER" =~ ^inrage/[A-Za-z0-9_.*-]+$ ]]; then
            echo "Use a single repository or pattern within inrage" >&2
            exit 1
          fi
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.INRBOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.INRBOT_APP_PRIVATE_KEY }}
          owner: inrage
          permission-administration: read
          permission-checks: read
          permission-members: read
          permission-contents: ${{ env.MODE == 'simulate' && 'read' || 'write' }}
          permission-issues: ${{ env.MODE == 'simulate' && 'read' || 'write' }}
          permission-pull-requests: ${{ env.MODE == 'simulate' && 'read' || 'write' }}
          permission-statuses: ${{ env.MODE == 'simulate' && 'read' || 'write' }}
          permission-workflows: ${{ env.MODE == 'update' && 'write' || '' }}
      - name: Check GitHub App access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          test -n "$GH_TOKEN"
          printf 'GitHub App: %s\n' "$APP_SLUG"
          gh api installation/repositories --jq '"Accessible repositories: " + (.total_count | tostring)'
      - name: Select repositories awaiting automerge
        id: reconcile
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          query=$(cat <<'GRAPHQL'
            query($endCursor: String) {
              search(query: "org:inrage is:pr is:open head:renovate-wordpress/wordpress-base-images", type: ISSUE, first: 100, after: $endCursor) {
                issueCount
                pageInfo { hasNextPage endCursor }
                nodes {
                  ... on PullRequest {
                    headRefName
                    reviewDecision
                    repository { nameWithOwner owner { login } }
                  }
                }
              }
            }
          GRAPHQL
          )
          gh api graphql --paginate --slurp -f query="$query" > "$response"
          repositories=$(jq -cer '
            if type != "array" or length == 0 or any(.[]; (.errors // [] | length) > 0)
            then error("Invalid GraphQL response") else . end
            | map(.data.search) as $pages
            | [$pages[].nodes[]] as $prs
            | if ($pages | map(.issueCount) | unique | length) != 1
                or $pages[0].issueCount > 1000
                or ($prs | length) != $pages[0].issueCount
                or $pages[-1].pageInfo.hasNextPage != false
                or any($pages[:-1][]; .pageInfo.hasNextPage != true or (.pageInfo.endCursor | type) != "string" or .pageInfo.endCursor == "")
              then error("Incomplete GraphQL pagination") else . end
            | if any($prs[]; .repository.owner.login != "inrage" or (.repository.nameWithOwner | test("^inrage/[A-Za-z0-9_.-]+$")) == false)
              then error("Repository outside inrage") else . end
            | [$prs[]
                | select(.headRefName == "renovate-wordpress/wordpress-base-images")
                | select(.reviewDecision == null or .reviewDecision == "APPROVED")
                | .repository.nameWithOwner] | unique
          ' "$response")
          printf 'repositories=%s\n' "$repositories" >> "$GITHUB_OUTPUT"
          if [[ "$repositories" == '[]' ]]; then
            printf 'has_repositories=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_repositories=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Update WordPress dependencies
        if: github.event_name != 'schedule' || steps.reconcile.outputs.has_repositories == 'true'
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.event_name == 'schedule' && steps.reconcile.outputs.repositories || env.REPOSITORY_FILTER }}
          RENOVATE_CONFIG_FILE: ${{ env.MODE == 'simulate' && '/config/renovate-wordpress.dry-run.cjs' || '/config/renovate-wordpress.json' }}
        run: |
          docker run --rm --cpus 2 --memory 4g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/config,readonly" \
            --env RENOVATE_TOKEN \
            --env RENOVATE_AUTODISCOVER_FILTER \
            --env RENOVATE_CONFIG_FILE \
            --entrypoint renovate \
            ghcr.io/renovatebot/renovate@sha256:9f571539ab94f0798d9439110ecf38c1e540920520794d87e111fbb97c322d50
