name: Update WordPress consumers

on:
  push:
    branches: [main]
    paths:
      - renovate-wordpress.json
      - renovate-wordpress.dry-run.cjs
      - .github/workflows/renovate-wordpress.yml
      - tests/renovate-workflow.rb
  pull_request:
    paths:
      - renovate-wordpress.json
      - renovate-wordpress.dry-run.cjs
      - .github/workflows/renovate-wordpress.yml
      - tests/renovate-workflow.rb
  workflow_dispatch:
    inputs:
      mode:
        description: Operation
        type: choice
        options:
          - simulate
          - update
        default: simulate
      repository_filter:
        description: Repository or pattern within inrage
        type: string
        default: inrage/*

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate Renovate configuration
        run: |
          ruby tests/renovate-workflow.rb
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/config,readonly" \
            --entrypoint renovate-config-validator \
            ghcr.io/renovatebot/renovate@sha256:9f571539ab94f0798d9439110ecf38c1e540920520794d87e111fbb97c322d50 \
            --strict /config/renovate-wordpress.json /config/renovate-wordpress.dry-run.cjs
  renovate:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: renovate-wordpress
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check execution scope
        env:
          REPOSITORY_FILTER: ${{ inputs.repository_filter }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            simulate|update) ;;
            *) echo "Unsupported operation" >&2; exit 1 ;;
          esac
          if [[ "$MODE" != simulate && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Write operations must run from main" >&2
            exit 1
          fi
          if [[ ! "$REPOSITORY_FILTER" =~ ^inrage/[A-Za-z0-9_.*-]+$ ]]; then
            echo "Use a single repository or pattern within inrage" >&2
            exit 1
          fi
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.INRBOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.INRBOT_APP_PRIVATE_KEY }}
          owner: inrage
          permission-administration: read
          permission-checks: read
          permission-members: read
          permission-contents: ${{ inputs.mode == 'simulate' && 'read' || 'write' }}
          permission-issues: ${{ inputs.mode == 'simulate' && 'read' || 'write' }}
          permission-pull-requests: ${{ inputs.mode == 'simulate' && 'read' || 'write' }}
          permission-statuses: ${{ inputs.mode == 'simulate' && 'read' || 'write' }}
          permission-workflows: ${{ inputs.mode == 'update' && 'write' || '' }}
      - name: Check GitHub App access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          test -n "$GH_TOKEN"
          printf 'GitHub App: %s\n' "$APP_SLUG"
          gh api installation/repositories --jq '"Accessible repositories: " + (.total_count | tostring)'
      - name: Update WordPress dependencies
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_AUTODISCOVER_FILTER: ${{ inputs.repository_filter }}
          RENOVATE_CONFIG_FILE: ${{ inputs.mode == 'simulate' && '/config/renovate-wordpress.dry-run.cjs' || '/config/renovate-wordpress.json' }}
        run: |
          docker run --rm --cpus 2 --memory 4g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/config,readonly" \
            --env RENOVATE_TOKEN \
            --env RENOVATE_AUTODISCOVER_FILTER \
            --env RENOVATE_CONFIG_FILE \
            --entrypoint renovate \
            ghcr.io/renovatebot/renovate@sha256:9f571539ab94f0798d9439110ecf38c1e540920520794d87e111fbb97c322d50
